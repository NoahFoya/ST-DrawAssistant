<!-- templates/settings.html -->
<!-- SillyTavern 原生扩展侧边栏抽屉菜单模板 -->
<div class="inline-drawer da-st-settings-drawer">
    <div class="inline-drawer-toggle inline-drawer-header da-st-drawer-header">
        <div class="da-st-drawer-title" style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 1.1em;">✨</span>
            <b class="da-st-drawer-name" style="font-size: 0.95em;">Starlight 绘图助手</b>
            <span class="da-st-version-tag" style="font-size: 0.72em; padding: 1px 6px; border-radius: 4px; background: rgba(0, 242, 254, 0.15); color: var(--da-accent-color, #00f2fe); border: 1px solid rgba(0, 242, 254, 0.3); font-family: monospace; font-weight: 600;">V0.2.0</span>
        </div>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content da-st-drawer-body" style="padding: 10px 4px 6px 4px;">
        <div class="da-st-row" style="margin-bottom: 10px;">
            <button id="da-open-main-modal-btn" class="menu_button da-btn primary" style="width: 100%; height: 36px; font-weight: 600; font-size: 0.88em; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px;">
                <span>⚙️</span> 打开绘图助手主面板
            </button>
        </div>
        <div class="da-st-row" style="display: flex; align-items: center; justify-content: space-between; padding: 4px 2px;">
            <label class="da-label" for="da-enable-fab-toggle" style="font-size: 0.85em; color: var(--SmartThemeBodyColor, var(--da-text-primary, #fff)); font-weight: 500;">显示桌面悬浮球 (FAB)</label>
            <label class="da-toggle">
                <input type="checkbox" id="da-enable-fab-toggle" checked />
                <span class="da-slider"></span>
            </label>
        </div>
    </div>
</div>
